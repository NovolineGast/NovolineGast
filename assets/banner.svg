<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gast — developer profile</title>
  <desc id="desc">Web development, developer tools, and ideas made runnable.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102b2b"/>
      <stop offset="1" stop-color="#101b23"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#a6d8cf" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#background)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="57" fill="#92c8bb" font-size="13" font-weight="600" letter-spacing="3">NOVOLINEGAST / GITHUB</text>
    <text x="52" y="157" fill="#f6f1e8" font-size="86" font-weight="700" letter-spacing="-4">Gast<tspan fill="#ffb276">.</tspan></text>
    <text x="57" y="206" fill="#e3eae6" font-size="23">Interfaces. Tools. Systems.</text>
    <text x="57" y="264" fill="#a8bbb8" font-size="16">Web development &amp; ideas made runnable.</text>
    <g transform="translate(785 77)">
      <rect width="355" height="168" rx="12" fill="#12262b" stroke="#3b5758"/>
      <circle cx="21" cy="20" r="4" fill="#ffb276"/>
      <circle cx="37" cy="20" r="4" fill="#86c8b2"/>
      <circle cx="53" cy="20" r="4" fill="#557778"/>
      <path d="M0 40H355" stroke="#3b5758"/>
      <text x="24" y="78" fill="#86c8b2" font-family="Consolas, monospace" font-size="14">$ turn ideas into software</text>
      <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
        <rect x="24" y="106" width="80" height="34" rx="6" fill="#213c3c"/>
        <text x="64" y="128" fill="#f6f1e8">build</text>
        <path d="M111 123H129m-5-4 5 4-5 4" stroke="#86c8b2" fill="none"/>
        <rect x="137" y="106" width="64" height="34" rx="6" fill="#213c3c"/>
        <text x="169" y="128" fill="#f6f1e8">run</text>
        <path d="M208 123H226m-5-4 5 4-5 4" stroke="#86c8b2" fill="none"/>
        <rect x="234" y="106" width="96" height="34" rx="6" fill="#ffb276"/>
        <text x="282" y="128" fill="#17272b">verify</text>
      </g>
    </g>
    <text x="1138" y="283" fill="#799793" font-family="Consolas, monospace" text-anchor="end" font-size="12">TS / PYTHON / JAVA</text>
  </g>
</svg>
